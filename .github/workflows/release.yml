name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve VERSION
        id: version
        run: |
          ref=${GITHUB_REF_NAME#v}
          if [[ "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "VERSION=$ref" >> $GITHUB_ENV
          else
            echo "VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_ENV
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i '' "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i '' "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" package.json

      - name: Build (aarch64-apple-darwin)
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Pack .app.tar.gz
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          tar -czf apisender-$VERSION-macos-arm64.app.tar.gz apisender.app
          ls -la

      - name: Rename dmg
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          mv apisender_*.dmg "apisender-$VERSION-macos-arm64.dmg"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/apisender-*-macos-arm64.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/apisender-*-macos-arm64.app.tar.gz

  build-macos-x64:
    name: Build (macOS x64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve VERSION
        id: version
        run: |
          ref=${GITHUB_REF_NAME#v}
          if [[ "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "VERSION=$ref" >> $GITHUB_ENV
          else
            echo "VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_ENV
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i '' "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i '' "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" package.json

      - name: Build (x86_64-apple-darwin)
        run: pnpm tauri build --target x86_64-apple-darwin

      - name: Pack .app.tar.gz
        run: |
          cd src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          tar -czf apisender-$VERSION-macos-x64.app.tar.gz apisender.app
          ls -la

      - name: Rename dmg
        run: |
          cd src-tauri/target/x86_64-apple-darwin/release/bundle/dmg
          mv apisender_*.dmg "apisender-$VERSION-macos-x64.dmg"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/apisender-*-macos-x64.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/apisender-*-macos-x64.app.tar.gz

  build-windows-x64:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve VERSION
        id: version
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME -replace '^v',''
          if ($ref -match '^\d+\.\d+\.\d+') {
            $VERSION = $ref
          } else {
            $VERSION = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          }
          "VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" package.json

      - name: Build (x86_64-pc-windows-msvc)
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles msi

      - name: Rename msi (drop _en-US suffix)
        shell: pwsh
        run: |
          $src = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" | Select-Object -First 1
          $dst = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/apisender-$env:VERSION-windows-x64.msi"
          Rename-Item -Path $src.FullName -NewName (Split-Path $dst -Leaf)
          Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi"

      - name: Build portable.zip
        shell: pwsh
        run: |
          $stageDir = "portable-$env:VERSION"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/apisender.exe" $stageDir
          if (Test-Path "src-tauri/target/x86_64-pc-windows-msvc/release/resources") {
            Copy-Item -Recurse "src-tauri/target/x86_64-pc-windows-msvc/release/resources" $stageDir
          }
          @"
          Portable apisender $env:VERSION (Windows x64)
          ==========================================
          - Requires Windows 10 1803+ or Windows 11
          - WebView2 Runtime must be installed (pre-installed on Win11)
          - Download: https://developer.microsoft.com/microsoft-edge/webview2/
          - Just run apisender.exe
          "@ | Out-File "$stageDir/README.txt"
          Compress-Archive -Path "$stageDir/*" -DestinationPath "apisender-$env:VERSION-windows-x64-portable.zip" -Force
          Get-ChildItem . -Filter *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            apisender-*-windows-x64-portable.zip

  build-windows-arm64:
    name: Build (Windows arm64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Resolve VERSION
        id: version
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME -replace '^v',''
          if ($ref -match '^\d+\.\d+\.\d+') {
            $VERSION = $ref
          } else {
            $VERSION = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          }
          "VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" package.json

      - name: Build (aarch64-pc-windows-msvc)
        run: pnpm tauri build --target aarch64-pc-windows-msvc --bundles msi

      - name: Rename msi (drop _en-US suffix)
        shell: pwsh
        run: |
          $src = Get-ChildItem "src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi" | Select-Object -First 1
          $dst = "src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/apisender-$env:VERSION-windows-arm64.msi"
          Rename-Item -Path $src.FullName -NewName (Split-Path $dst -Leaf)
          Get-ChildItem "src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi"

      - name: Build portable.zip
        shell: pwsh
        run: |
          $stageDir = "portable-$env:VERSION"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "src-tauri/target/aarch64-pc-windows-msvc/release/apisender.exe" $stageDir
          if (Test-Path "src-tauri/target/aarch64-pc-windows-msvc/release/resources") {
            Copy-Item -Recurse "src-tauri/target/aarch64-pc-windows-msvc/release/resources" $stageDir
          }
          @"
          Portable apisender $env:VERSION (Windows ARM64)
          ============================================
          - Requires Windows 11 ARM64
          - Just run apisender.exe
          "@ | Out-File "$stageDir/README.txt"
          Compress-Archive -Path "$stageDir/*" -DestinationPath "apisender-$env:VERSION-windows-arm64-portable.zip" -Force
          Get-ChildItem . -Filter *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
            apisender-*-windows-arm64-portable.zip

  build-linux-x64:
    name: Build (Linux x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve VERSION
        id: version
        run: |
          ref=${GITHUB_REF_NAME#v}
          if [[ "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "VERSION=$ref" >> $GITHUB_ENV
          else
            echo "VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_ENV
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" package.json

      - name: Build (x86_64-unknown-linux-gnu)
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles deb,appimage

      - name: Rename deb + AppImage
        run: |
          cd src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb
          mv apisender_*.deb "apisender-$VERSION-linux-x64.deb"
          cd ../appimage
          mv apisender_*.AppImage "apisender-$VERSION-linux-x64.AppImage"
          ls -la deb appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/apisender-*-linux-x64.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/apisender-*-linux-x64.AppImage

  build-linux-arm64:
    name: Build (Linux arm64)
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Resolve VERSION
        id: version
        run: |
          ref=${GITHUB_REF_NAME#v}
          if [[ "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "VERSION=$ref" >> $GITHUB_ENV
          else
            echo "VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_ENV
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" package.json

      - name: Build (aarch64-unknown-linux-gnu)
        run: pnpm tauri build --target aarch64-unknown-linux-gnu --bundles deb,appimage

      - name: Rename deb + AppImage
        run: |
          cd src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb
          mv apisender_*.deb "apisender-$VERSION-linux-arm64.deb"
          cd ../appimage
          mv apisender_*.AppImage "apisender-$VERSION-linux-arm64.AppImage"
          ls -la deb appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/apisender-*-linux-arm64.deb
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/apisender-*-linux-arm64.AppImage

  release:
    name: Upload Release
    needs:
      - build-macos-arm64
      - build-macos-x64
      - build-windows-x64
      - build-windows-arm64
      - build-linux-x64
      - build-linux-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve VERSION
        id: version
        run: |
          ref=${GITHUB_REF_NAME#v}
          if [[ "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "VERSION=$ref" >> $GITHUB_ENV
          else
            echo "VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_ENV
          fi

      - name: Arrange release artifacts
        run: |
          mkdir -p dist
          set +e

          # macOS arm64
          cp artifacts/macos-arm64/apisender-$VERSION-macos-arm64.app.tar.gz dist/ 2>/dev/null
          cp artifacts/macos-arm64/*.dmg dist/ 2>/dev/null

          # macOS x64
          cp artifacts/macos-x64/apisender-$VERSION-macos-x64.app.tar.gz dist/ 2>/dev/null
          cp artifacts/macos-x64/*.dmg dist/ 2>/dev/null

          # Windows x64
          cp artifacts/windows-x64/*.msi dist/ 2>/dev/null
          cp artifacts/windows-x64/apisender-$VERSION-windows-x64-portable.zip dist/ 2>/dev/null

          # Windows arm64
          cp artifacts/windows-arm64/*.msi dist/ 2>/dev/null
          cp artifacts/windows-arm64/apisender-$VERSION-windows-arm64-portable.zip dist/ 2>/dev/null

          # Linux x64
          cp artifacts/linux-x64/*.deb dist/ 2>/dev/null
          cp artifacts/linux-x64/*.AppImage dist/ 2>/dev/null

          # Linux arm64
          cp artifacts/linux-arm64/*.deb dist/ 2>/dev/null
          cp artifacts/linux-arm64/*.AppImage dist/ 2>/dev/null

          echo "=== Final release artifacts ==="
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "apisender ${{ github.ref_name }}"
          draft: true
          generate_release_notes: true
          files: dist/*
