          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" package.json

      - name: Build (aarch64-pc-windows-msvc)
        run: pnpm tauri build --target aarch64-pc-windows-msvc --bundles msi --config src-tauri/tauri.updater.conf.json

      - name: Rename msi (drop _en-US suffix)
        shell: pwsh
        run: |
          $src = Get-ChildItem "src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi" | Select-Object -First 1
          $dst = "src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/apisender-$env:VERSION-windows-arm64.msi"
          $sig = "$($src.FullName).sig"
          Rename-Item -Path $src.FullName -NewName (Split-Path $dst -Leaf)
          Rename-Item -Path $sig -NewName "$(Split-Path $dst -Leaf).sig"
          Get-ChildItem "src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi"

      - name: Build portable.zip
        shell: pwsh
        run: |
          $stageDir = "portable-$env:VERSION"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "src-tauri/target/aarch64-pc-windows-msvc/release/apisender.exe" $stageDir
          if (Test-Path "src-tauri/target/aarch64-pc-windows-msvc/release/resources") {
            Copy-Item -Recurse "src-tauri/target/aarch64-pc-windows-msvc/release/resources" $stageDir
          }
          @"
          Portable apisender $env:VERSION (Windows ARM64)
          ============================================
          - Requires Windows 11 ARM64
          - Just run apisender.exe
          "@ | Out-File "$stageDir/README.txt"
          Compress-Archive -Path "$stageDir/*" -DestinationPath "apisender-$env:VERSION-windows-arm64-portable.zip" -Force
          Get-ChildItem . -Filter *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi.sig
            apisender-*-windows-arm64-portable.zip

  build-linux-x64:
    name: Build (Linux x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve VERSION
        id: version
        run: |
          ref=${GITHUB_REF_NAME#v}
          if [[ "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "VERSION=$ref" >> $GITHUB_ENV
          else
            echo "VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_ENV
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare updater signing key
        env:
          UPDATER_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/prepare-updater-signing-key.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" package.json

      - name: Build (x86_64-unknown-linux-gnu)
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles deb,appimage --config src-tauri/tauri.updater.conf.json

      - name: Rename deb + AppImage
        run: |
          cd src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          mv deb/apisender_*.deb "deb/apisender-$VERSION-linux-x64.deb"
          mv appimage/apisender_*.AppImage "appimage/apisender-$VERSION-linux-x64.AppImage"
          mv appimage/*.AppImage.sig "appimage/apisender-$VERSION-linux-x64.AppImage.sig"
          ls -la deb appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/apisender-*-linux-x64.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/apisender-*-linux-x64.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/apisender-*-linux-x64.AppImage.sig

  build-linux-arm64:
    name: Build (Linux arm64)
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Resolve VERSION
        id: version
        run: |
          ref=${GITHUB_REF_NAME#v}
          if [[ "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "VERSION=$ref" >> $GITHUB_ENV
          else
            echo "VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_ENV
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare updater signing key
        env:
          UPDATER_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/prepare-updater-signing-key.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" package.json

      - name: Build (aarch64-unknown-linux-gnu)
        run: pnpm tauri build --target aarch64-unknown-linux-gnu --bundles deb,appimage --config src-tauri/tauri.updater.conf.json

      - name: Rename deb + AppImage
        run: |
          cd src-tauri/target/aarch64-unknown-linux-gnu/release/bundle
          mv deb/apisender_*.deb "deb/apisender-$VERSION-linux-arm64.deb"
          mv appimage/apisender_*.AppImage "appimage/apisender-$VERSION-linux-arm64.AppImage"
          mv appimage/*.AppImage.sig "appimage/apisender-$VERSION-linux-arm64.AppImage.sig"
          ls -la deb appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/apisender-*-linux-arm64.deb
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/apisender-*-linux-arm64.AppImage
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/apisender-*-linux-arm64.AppImage.sig

  release:
    name: Upload Release
    needs:
      - build-macos-arm64
      - build-macos-x64
      - build-windows-x64
      - build-windows-arm64
      - build-linux-x64
      - build-linux-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve VERSION
        id: version
        run: |
          ref=${GITHUB_REF_NAME#v}
          if [[ "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "VERSION=$ref" >> $GITHUB_ENV
          else
            echo "VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_ENV
          fi

      - name: Arrange release artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.msi" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.sig" -o \
            -name "*-portable.zip" -o \
            -name "*.app.tar.gz" \
          \) -exec cp -v {} dist/ \;

          echo "=== Final release artifacts ==="
          ls -la dist/

      - name: Generate latest.json
        run: node scripts/generate-updater-json.mjs

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          fail_on_unmatched_files: true
          files: dist/*
