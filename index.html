<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Api Sender</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var resolved = "light";
          if (t === "dark") resolved = "dark";
          else if (t === "light") resolved = "light";
          else
            resolved = window.matchMedia("(prefers-color-scheme: dark)")
              .matches
              ? "dark"
              : "light";
          // ⚠️ 同步注意事项(改色必读):
          //   以下两行背景/前景色是为了在 CSS 加载完成前(避免首屏闪白/闪黑)
          //   在 <html> 上写入 inline 样式,与 src/index.css 里的主题变量是副本。
          //   改色时务必同步更新下面四处:
          //     src/index.css:5   --background light = oklch(1 0 0)
          //     src/index.css:6   --foreground light = oklch(0.145 0 0)
          //     src/index.css:52  --background dark  = oklch(0.22 0.022 245)
          //     src/index.css:53  --foreground dark  = oklch(0.985 0 0)
          var bg = resolved === "dark" ? "oklch(0.22 0.022 245)" : "oklch(1 0 0)";
          var fg = resolved === "dark" ? "oklch(0.985 0 0)" : "oklch(0.145 0 0)";
          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.color = fg;
          if (resolved === "dark")
            document.documentElement.classList.add("dark");

          // ⚠️ UI 字体预读(避免首屏 UI 元素字体闪烁):
          //   --font-ui-custom 由 inline script 在 CSS 加载前写入。
          //   编辑器/响应区域的字体和字号仅在对应 Tab 打开时由 store 加载,
          //   首屏不渲染这些区域,无需 pre-read,无 FOUC 风险。
          var uiFontFamily = localStorage.getItem("uiFontFamily");
          if (uiFontFamily) {
            document.documentElement.style.setProperty(
              "--font-ui-custom",
              '"' + uiFontFamily + '"'
            );
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
